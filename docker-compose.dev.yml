# Local development database, published on localhost.
#
#   docker compose -f docker-compose.dev.yml up -d
#   cd backend  && npm run dev     # http://localhost:5000
#   cd frontend && npm run dev     # http://localhost:3000, proxies /api
#
# Same FerretDB and DocumentDB images as production, so development matches what
# the Pi actually runs. Kept in a separate file from docker-compose.yml so there
# is no chance of starting the development database with production settings by
# accident.
#
# backend/.env then wants:
#   MONGODB_URI=mongodb://hector:devpassword@localhost:27017/hector

name: hector-dev

services:
  postgres:
    image: ghcr.io/ferretdb/postgres-documentdb:${DOCUMENTDB_TAG:-17-0.107.0-ferretdb-2.7.0}
    restart: unless-stopped
    environment:
      POSTGRES_USER: hector
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: postgres
    volumes:
      - pg-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hector -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  ferretdb:
    image: ghcr.io/ferretdb/ferretdb:${FERRETDB_TAG:-2.7.0}
    restart: unless-stopped
    environment:
      FERRETDB_POSTGRESQL_URL: postgres://hector:devpassword@postgres:5432/postgres
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:27017:27017"

volumes:
  pg-dev-data:
